# ============================================================
# 台股 Market & Stock Regime Dashboard — 集中設定檔
# 所有權重 / 門檻 / 時間窗 / 資料來源皆在此調整，前端不 hard-code。
# ============================================================

app:
  title: "台股市場狀態儀表板"
  timezone: "Asia/Taipei"

# ---------- 資料來源 ----------
data_source:
  cache_dir: "data/cache"
  price_history_range: "2y"          # Yahoo chart range
  index_history_months: 24           # TWSE / TPEx 月資料回溯月數
  institutional_history_days: 130    # 三大法人（大盤）回溯交易日
  stock_institutional_history_days: 65  # 個股法人（T86）回溯交易日
  twse_request_interval_sec: 2.0     # TWSE 防封鎖節流
  http_timeout_sec: 20
  watchlist_csv: "config/watchlist.csv"
  universe_csv: "config/universe.csv"
  external:
    VIX: "^VIX"
    USD/TWD: "TWD=X"
    US10Y: "^TNX"
    Nasdaq: "^IXIC"
    SOX: "^SOX"
    "S&P 500": "^GSPC"
    Nikkei: "^N225"
    "Hang Seng": "^HSI"

# ---------- 更新頻率 ----------
update:
  price_refresh_minutes: 15     # 盤中價格快取有效時間
  daily_refresh_hour: 15        # 每日 15:00 後重新抓取日線 / 籌碼
  chip_refresh_hour: 17         # 法人資料約 16:30 後公布
  stale_after_days: 3           # 超過 N 個日曆日未更新視為 stale

# ---------- 時間窗 ----------
windows:
  changes: [1, 3, 5, 20, 60, 120, 250]
  slopes: [5, 20, 60]
  percentiles: [20, 60, 250]
  zscores: [20, 60, 250]
  ma: [20, 60, 120, 240]
  sparkline: 60
  rs_market: [1, 5, 20, 60, 120]
  rs_sector: [5, 20, 60]

# ---------- 分數權重 ----------
market_score_weights:
  trend: 0.25
  breadth: 0.20
  momentum: 0.15
  liquidity: 0.10
  money_flow: 0.15
  risk: 0.15

stock_score_weights:
  trend: 0.20
  momentum: 0.15
  volume: 0.10
  institutional: 0.20
  relative_strength: 0.20
  fundamental: 0.15

rs_score_weights:   # 各時間尺度超額報酬權重
  5: 0.15
  20: 0.30
  60: 0.30
  120: 0.25

# ---------- 標籤門檻 ----------
thresholds:
  slope_flat: 0.0005          # |normalized slope| 小於此視為持平（每日 0.05%）
  accel_flat: 0.0005
  flow_slope_flat: 0.05       # 法人流量 slope（以 std 正規化）
  volume_high_pct: 80         # 成交量 60D 百分位
  volume_low_pct: 20
  breadth_change_flat: 3      # 廣度 5D 變化（百分點）
  trend_bull: 60
  trend_bear: 40
  volume_spike_ratio: 1.8     # 量 / MA20
  volatility_spike_pct: 90    # 波動度 250D 百分位
  breakout_lookback: 60
  rs_breakout: 80
  divergence_window: 10       # 背離比較期間（交易日）
  divergence_price_min: 0.015 # 價格至少變動 1.5% 才判斷背離
  regime_change_lookback: 5

# ---------- Regime 門檻 ----------
regime:
  strong_bull: {score: 75, trend: 75, breadth: 60}
  bull: {score: 60, trend: 60}
  bull_pullback: {trend_min: 55, momentum_max: 45}
  recovery: {trend_max: 50, momentum_min: 58}
  rotation: {score_min: 45, score_max: 62, breadth_max: 50, dispersion_min: 0.04}
  neutral: {score_min: 45}
  weak: {score_min: 35}
  bear: {score_max: 35, trend_max: 35}
  strong_bear: {score_max: 22, trend_max: 22}
  capitulation: {breadth_max: 15, roc5_max: -0.05, volume_pct_min: 85}
